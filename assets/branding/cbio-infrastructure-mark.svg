<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true" focusable="false">
  <!-- CBIO Genomics Infrastructure Cost Planner — graphical mark (spec 010a,
       refined 010b). DNA double helix + three infrastructure nodes (storage
       / compute / transfer). Flat shapes and strokes only: no gradients,
       shadows, filters, or embedded raster data. GRO colours only.
       010b: fewer/larger twists and wider strand separation so the helix
       reads clearly as DNA, thinner connectors so they stay subordinate to
       it, and larger node icons. -->

  <!-- DNA double helix: two mirrored strands sharing the same axis crossings -->
  <path d="M38 8 C62 8 62 83 38 83 C14 83 14 157 38 157 C62 157 62 232 38 232"
        fill="none" stroke="#042C5B" stroke-width="9" stroke-linecap="round" />
  <path d="M38 8 C14 8 14 83 38 83 C62 83 62 157 38 157 C14 157 14 232 38 232"
        fill="none" stroke="#0B8BA5" stroke-width="9" stroke-linecap="round" />

  <!-- base-pair rungs -->
  <line x1="20" y1="46" x2="56" y2="46" stroke="#172B3A" stroke-width="3.5" stroke-linecap="round" />
  <line x1="20" y1="120" x2="56" y2="120" stroke="#172B3A" stroke-width="3.5" stroke-linecap="round" />
  <line x1="20" y1="195" x2="56" y2="195" stroke="#172B3A" stroke-width="3.5" stroke-linecap="round" />

  <!-- connectors from helix to each infrastructure node: thinner than the
       helix strands so DNA -> infrastructure reads as the intended hierarchy -->
  <line x1="38" y1="44" x2="116" y2="44" stroke="#0B8BA5" stroke-width="3" stroke-linecap="round" />
  <line x1="38" y1="120" x2="116" y2="120" stroke="#042C5B" stroke-width="3" stroke-linecap="round" />
  <line x1="38" y1="196" x2="116" y2="196" stroke="#0B8BA5" stroke-width="3" stroke-linecap="round" />

  <!-- storage node -->
  <circle cx="152" cy="44" r="36" fill="#0B8BA5" />
  <ellipse cx="152" cy="30" rx="15" ry="5" fill="#FFFFFF" />
  <ellipse cx="152" cy="44" rx="15" ry="5" fill="#FFFFFF" />
  <ellipse cx="152" cy="58" rx="15" ry="5" fill="#FFFFFF" />

  <!-- compute node -->
  <circle cx="152" cy="120" r="36" fill="#042C5B" />
  <rect x="139" y="107" width="26" height="26" rx="4" fill="#FFFFFF" />
  <line x1="146" y1="101" x2="146" y2="107" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="158" y1="101" x2="158" y2="107" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="146" y1="133" x2="146" y2="139" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="158" y1="133" x2="158" y2="139" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="133" y1="113" x2="139" y2="113" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="133" y1="127" x2="139" y2="127" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="165" y1="113" x2="171" y2="113" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="165" y1="127" x2="171" y2="127" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- transfer node: bidirectional arrows -->
  <circle cx="152" cy="196" r="36" fill="#0B8BA5" />
  <line x1="136" y1="189" x2="163" y2="189" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="156,183 163,189 156,195" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="168" y1="203" x2="141" y2="203" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="148,197 141,203 148,209" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>

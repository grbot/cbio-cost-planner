# AWS pricing assumptions for the CBIO cost planner.
#
# IMPORTANT: every price below is an UNVERIFIED PLACEHOLDER derived from
# approximate/published AWS af-south-1 (Cape Town) list pricing at the time
# this file was written. It has NOT been reconciled against an actual AWS
# account or invoice. Replace with confirmed rates (and update
# pricing_last_verified / source) before using this tool for real budgeting.

aws:
  provider: AWS
  region: af-south-1
  region_name: "Africa (Cape Town)"
  pricing_source: "https://aws.amazon.com/s3/pricing/"
  pricing_last_verified: "2026-08-31"

  exchange_rate:
    usd_zar: 16.05
    as_of: "2026-09-14"
    source: "Placeholder — replace with an approved UCT/CBIO exchange-rate source."

  vat_percent: 15

  storage_classes:
    s3_standard:
      label: "S3 Standard"
      minimum_storage_duration_days: 0
      requires_restore: false
      retrieval_usd_per_gb: 0.0000
      retrieval_characteristics: >-
        Directly readable at any time. No restore step and no retrieval charge.
      tiers:
        - up_to_gb: 51200
          usd_per_gb_month: 0.0274
        - up_to_gb: 512000
          usd_per_gb_month: 0.0262
        - up_to_gb: null
          usd_per_gb_month: 0.0250
      pricing_last_verified: "UNVERIFIED"
      source: "Placeholder — approximate AWS af-south-1 S3 Standard list pricing."

    glacier_instant:
      label: "Glacier Instant Retrieval"
      minimum_storage_duration_days: 90
      requires_restore: false
      retrieval_usd_per_gb: 0.0300
